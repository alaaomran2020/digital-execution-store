<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>نظام إدارة العيادات والمراكز</title><style>*{box-sizing:border-box}body{font-family:Arial;background:#08111f;color:#eef4ff;margin:0}header,nav,main{max-width:1280px;margin:auto;padding:16px}nav,.bar{display:flex;gap:8px;flex-wrap:wrap}button,input,select{padding:10px;border:1px solid #33466a;border-radius:9px;background:#111d34;color:#fff}button{cursor:pointer}.view{display:none}.active{display:block}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}.card,section{background:#111d34;border:1px solid #273b5c;border-radius:14px;padding:14px;margin:10px 0}.scroll{overflow:auto}table{width:100%;border-collapse:collapse}th,td{padding:8px;border-bottom:1px solid #273b5c;text-align:right;white-space:nowrap}.warn{color:#ffd38a}.ok{color:#8df0b3}</style></head><body>
<header><h1>نظام إدارة العيادات والمراكز</h1><p>مريض ← موعد ← زيارة ← خدمة ← تحصيل ← مصروف ← متابعة إدارية ← تقارير ← أرشيف</p><div class="bar"><button onclick="backup()">نسخة احتياطية</button><input id="restore" type="file" accept="application/json"><button onclick="restoreData()">استعادة النسخة</button></div></header><nav id="nav"></nav><main>
<section id="dashboard" class="view active"><h2>لوحة التحكم</h2><div id="cards" class="cards"></div><div id="alerts"></div></section>
<section id="patients" class="view"><h2>المرضى</h2><div class="bar"><input id="pn" placeholder="اسم المريض"><input id="pc" placeholder="رقم الهاتف"><input id="pa" placeholder="العنوان - اختياري"><button onclick="addPatient()">إضافة</button></div><div id="patientsT"></div></section>
<section id="appointments" class="view"><h2>المواعيد</h2><div class="bar"><input id="apid" placeholder="كود المريض"><input id="apdate" type="date"><input id="aptime" type="time"><input id="apservice" placeholder="الخدمة"><select id="apstatus"><option value="booked">محجوز</option><option value="confirmed">مؤكد</option><option value="attended">حضر</option><option value="cancelled">ملغي</option><option value="noshow">لم يحضر</option></select><button onclick="addAppointment()">إضافة</button></div><div id="appointmentsT"></div></section>
<section id="visits" class="view"><h2>الزيارات والتحصيل</h2><div class="bar"><input id="vapid" placeholder="كود الموعد"><input id="vservice" placeholder="الخدمة المقدمة"><input id="vfee" type="number" min="0" placeholder="قيمة الخدمة"><input id="vpaid" type="number" min="0" placeholder="المدفوع"><button onclick="addVisit()">تسجيل الزيارة</button></div><div id="visitsT"></div></section>
<section id="expenses" class="view"><h2>المصروفات</h2><div class="bar"><input id="ecat" placeholder="بند المصروف"><input id="eamount" type="number" min="0" placeholder="القيمة"><button onclick="addExpense()">إضافة</button></div><div id="expensesT"></div></section>
<section id="followups" class="view"><h2>المتابعة الإدارية</h2><div class="bar"><input id="fpid" placeholder="كود المريض"><input id="fdate" type="date"><input id="fnote" placeholder="ملاحظة إدارية فقط"><button onclick="addFollowup()">إضافة</button></div><div id="followupsT"></div></section>
<section id="reports" class="view"><h2>التقارير</h2><div id="reportsT"></div></section><section id="quality" class="view"><h2>فحص الجودة</h2><div id="qualityT"></div></section><section id="archive" class="view"><h2>الأرشيف</h2><div id="archiveT"></div></section></main>
<script>
const K='de_clinic_medical_center_os_v1',blank=()=>({patients:[],appointments:[],visits:[],expenses:[],followups:[]});let db;try{db=JSON.parse(localStorage.getItem(K)||'null')||blank()}catch(e){db=blank()}for(const k of Object.keys(blank()))if(!Array.isArray(db[k]))db[k]=[];
const V=[['dashboard','لوحة التحكم'],['patients','المرضى'],['appointments','المواعيد'],['visits','الزيارات والتحصيل'],['expenses','المصروفات'],['followups','المتابعة الإدارية'],['reports','التقارير'],['quality','الجودة'],['archive','الأرشيف']];nav.innerHTML=V.map(x=>`<button onclick="show('${x[0]}')">${x[1]}</button>`).join('');
const n=x=>Number(x)||0,today=()=>new Date().toISOString().slice(0,10),money=x=>n(x).toLocaleString('ar-EG')+' ج.م';function id(p,a){return p+'-'+String(a.reduce((m,x)=>Math.max(m,n(String(x.id||'').split('-').pop())),0)+1).padStart(4,'0')}function save(){localStorage.setItem(K,JSON.stringify(db));render()}function show(x){document.querySelectorAll('.view').forEach(e=>e.classList.remove('active'));document.getElementById(x).classList.add('active');render()}function patient(x){return db.patients.find(y=>y.id===x)}function appointment(x){return db.appointments.find(y=>y.id===x)}function table(a,c){return '<div class=scroll><table><tr>'+c.map(x=>'<th>'+x[0]+'</th>').join('')+'</tr>'+a.map(r=>'<tr>'+c.map(x=>'<td>'+(r[x[1]]??'')+'</td>').join('')+'</tr>').join('')+'</table></div>'}
function addPatient(){if(!pn.value.trim()||!pc.value.trim())return alert('أدخل اسم المريض ورقم الهاتف');db.patients.push({id:id('PT',db.patients),name:pn.value.trim(),contact:pc.value.trim(),address:pa.value.trim(),created:today()});save()}
function addAppointment(){let p=patient(apid.value.trim());if(!p||!apdate.value||!aptime.value||!apservice.value.trim())return alert('تحقق من بيانات الموعد');db.appointments.push({id:id('AP',db.appointments),patientId:p.id,date:apdate.value,time:aptime.value,service:apservice.value.trim(),status:apstatus.value});save()}
function addVisit(){let a=appointment(vapid.value.trim()),fee=n(vfee.value),paid=n(vpaid.value);if(!a||a.status==='cancelled'||a.status==='noshow'||fee<=0||paid<0||paid>fee)return alert('تحقق من الموعد والقيم المالية');if(db.visits.some(v=>v.appointmentId===a.id))return alert('تم تسجيل زيارة لهذا الموعد بالفعل');a.status='attended';db.visits.push({id:id('VS',db.visits),appointmentId:a.id,patientId:a.patientId,service:vservice.value.trim()||a.service,fee,paid,balance:fee-paid,date:today()});save()}
function addExpense(){if(!ecat.value.trim()||n(eamount.value)<=0)return alert('تحقق من بيانات المصروف');db.expenses.push({id:id('EX',db.expenses),category:ecat.value.trim(),amount:n(eamount.value),date:today()});save()}
function addFollowup(){if(!patient(fpid.value.trim())||!fdate.value||!fnote.value.trim())return alert('تحقق من بيانات المتابعة');db.followups.push({id:id('FU',db.followups),patientId:fpid.value.trim(),date:fdate.value,note:fnote.value.trim(),done:false});save()}
function backup(){let a=document.createElement('a'),u=URL.createObjectURL(new Blob([JSON.stringify({schema:1,product:'clinic-medical-center-os',version:'1.0.0',exportedAt:new Date().toISOString(),data:db},null,2)],{type:'application/json'}));a.href=u;a.download='clinic-medical-center-os-v1.0.0-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function restoreData(){let f=restore.files[0];if(!f)return alert('اختر ملف النسخة الاحتياطية');let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result),d=x&&x.data?x.data:x;if(!d||!['patients','appointments','visits','expenses','followups'].every(k=>Array.isArray(d[k])))return alert('ملف النسخة الاحتياطية غير متوافق');db=d;save();alert('تمت الاستعادة بنجاح')}catch(e){alert('ملف غير صالح')}};r.readAsText(f)}
function render(){patientsT.innerHTML=table(db.patients,[['الكود','id'],['الاسم','name'],['الهاتف','contact'],['العنوان','address']]);appointmentsT.innerHTML=table(db.appointments,[['الكود','id'],['المريض','patientId'],['التاريخ','date'],['الوقت','time'],['الخدمة','service'],['الحالة','status']]);visitsT.innerHTML=table(db.visits.map(v=>({...v,fee:money(v.fee),paid:money(v.paid),balance:money(v.balance)})),[['الكود','id'],['المريض','patientId'],['الخدمة','service'],['القيمة','fee'],['المدفوع','paid'],['المتبقي','balance']]);expensesT.innerHTML=table(db.expenses.map(e=>({...e,amount:money(e.amount)})),[['الكود','id'],['البند','category'],['القيمة','amount'],['التاريخ','date']]);followupsT.innerHTML=table(db.followups,[['الكود','id'],['المريض','patientId'],['التاريخ','date'],['الملاحظة','note']]);let day=db.appointments.filter(a=>a.date===today()&&a.status!=='cancelled').length,revenue=db.visits.reduce((a,v)=>a+v.paid,0),due=db.visits.reduce((a,v)=>a+v.balance,0),exp=db.expenses.reduce((a,e)=>a+e.amount,0),noshow=db.appointments.filter(a=>a.status==='noshow').length;cards.innerHTML=[['مواعيد اليوم',day],['إجمالي المحصل',money(revenue)],['مبالغ مستحقة',money(due)],['المصروفات',money(exp)],['صافي النقد',money(revenue-exp)],['لم يحضر',noshow]].map(x=>`<div class=card><b>${x[0]}</b><h3>${x[1]}</h3></div>`).join('');alerts.innerHTML=`<p class="${due?'warn':'ok'}">مبالغ مستحقة: ${money(due)}</p>`;reportsT.innerHTML=`<p>إجمالي قيمة الخدمات: ${money(db.visits.reduce((a,v)=>a+v.fee,0))}</p><p>المحصل: ${money(revenue)}</p><p>المتبقي: ${money(due)}</p><p>المصروفات: ${money(exp)}</p><p>صافي النقد: ${money(revenue-exp)}</p>`;let orphanA=db.appointments.filter(a=>!patient(a.patientId)).length,orphanV=db.visits.filter(v=>!appointment(v.appointmentId)||!patient(v.patientId)).length,bad=db.visits.filter(v=>v.paid<0||v.balance<0||v.paid>v.fee).length;qualityT.innerHTML=`<p>مواعيد بدون مريض: ${orphanA}</p><p>زيارات غير مترابطة: ${orphanV}</p><p>قيم مالية غير سليمة: ${bad}</p>`;archiveT.innerHTML=table(db.appointments.filter(a=>['cancelled','noshow'].includes(a.status)),[['الكود','id'],['المريض','patientId'],['التاريخ','date'],['الحالة','status']])}render();
</script></body></html>
