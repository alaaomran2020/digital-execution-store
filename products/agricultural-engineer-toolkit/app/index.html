<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>نظام المهندس الزراعي</title><style>body{font-family:Arial;background:#071512;color:#eef7f3;margin:0}header,nav,main{max-width:1180px;margin:auto;padding:16px}nav{display:flex;gap:8px;flex-wrap:wrap}button,input,select{padding:10px;border-radius:9px;border:1px solid #31564a;background:#10251f;color:#fff}button{cursor:pointer}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}.card,section{background:#10251f;border:1px solid #24463b;border-radius:14px;padding:14px;margin:10px 0}.view{display:none}.view.active{display:block}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.scroll{overflow:auto}table{width:100%;border-collapse:collapse}th,td{padding:9px;border-bottom:1px solid #24463b;text-align:right}.warn{color:#ffd58a}</style></head><body><header><h1>باكدج المهندس الزراعي الاحترافي</h1><p>إدارة الحقول والمواسم والعمليات والمدخلات والمصروفات والحصاد محليًا.</p></header><nav id="nav"></nav><main><section id="dashboard" class="view active"><h2>لوحة التحكم</h2><div id="cards" class="cards"></div><div id="alerts"></div></section>
<section id="farms" class="view"><h2>المزارع والحقول</h2><div class="toolbar"><input id="fn" placeholder="اسم المزرعة"><button onclick="addFarm()">إضافة مزرعة</button><input id="ff" placeholder="كود المزرعة"><input id="fl" placeholder="اسم الحقل"><input id="fa" type="number" placeholder="المساحة"><button onclick="addField()">إضافة حقل</button></div><div id="farmsT" class="scroll"></div><div id="fieldsT" class="scroll"></div></section>
<section id="seasons" class="view"><h2>المواسم والمحاصيل</h2><div class="toolbar"><input id="sf" placeholder="كود الحقل"><input id="sc" placeholder="المحصول"><input id="ss" type="date"><button onclick="addSeason()">إضافة موسم</button></div><div id="seasonsT"></div></section>
<section id="operations" class="view"><h2>العمليات والمهام</h2><div class="toolbar"><input id="os" placeholder="كود الموسم"><input id="ot" placeholder="العملية"><input id="od" type="date"><button onclick="addOperation()">إضافة</button></div><div id="operationsT"></div></section>
<section id="irrigation" class="view"><h2>الري</h2><div class="toolbar"><input id="is" placeholder="كود الموسم"><input id="idate" type="date"><button onclick="addIrrigation()">تسجيل ري</button></div><div id="irrigationT"></div></section>
<section id="fertilization" class="view"><h2>التسميد</h2><div class="toolbar"><input id="fsn" placeholder="كود الموسم"><input id="fm" placeholder="المادة/العملية"><input id="fd" type="date"><button onclick="addFertilization()">تسجيل</button></div><div id="fertilizationT"></div></section><section id="protection" class="view"><h2>المكافحة والمتابعة الميدانية</h2><div class="toolbar"><input id="ps" placeholder="كود الموسم"><input id="pn" placeholder="الملاحظة أو الإجراء"><input id="pd" type="date"><button onclick="addProtection()">تسجيل</button></div><div id="protectionT"></div></section><section id="labor" class="view"><h2>العمالة</h2><div class="toolbar"><input id="ls" placeholder="كود الموسم"><input id="lw" placeholder="العمل"><input id="lc" type="number" placeholder="التكلفة"><button onclick="addLabor()">تسجيل</button></div><div id="laborT"></div></section><section id="inputs" class="view"><h2>المدخلات والمخزون</h2><div class="toolbar"><input id="inm" placeholder="اسم المدخل"><input id="inq" type="number" placeholder="الكمية"><input id="inmin" type="number" placeholder="حد التنبيه"><button onclick="addInput()">إضافة</button></div><div id="inputsT"></div><div class="toolbar"><input id="ti" placeholder="كود المدخل"><select id="tt"><option>إضافة</option><option>صرف</option></select><input id="tq" type="number" placeholder="الكمية"><input id="ts" placeholder="كود الموسم عند الصرف"><button onclick="addInputTxn()">تسجيل حركة</button></div><div id="inputTxnsT"></div></section>
<section id="expenses" class="view"><h2>المصروفات</h2><div class="toolbar"><input id="es" placeholder="كود الموسم"><input id="ec" placeholder="التصنيف"><input id="ev" type="number" placeholder="القيمة"><button onclick="addExpense()">إضافة</button></div><div id="expensesT"></div></section>
<section id="harvest" class="view"><h2>الحصاد والإنتاجية</h2><div class="toolbar"><input id="hs" placeholder="كود الموسم"><input id="hq" type="number" placeholder="كمية الحصاد"><input id="hd" type="date"><button onclick="addHarvest()">تسجيل حصاد</button></div><div id="harvestT"></div></section>
<section id="closure" class="view"><h2>إغلاق الموسم</h2><div class="toolbar"><input id="cs" placeholder="كود الموسم"><input id="cd" type="date"><button onclick="closeSeason()">إغلاق الموسم</button></div><div id="closureT"></div></section><section id="quality" class="view"><h2>فحص الجودة</h2><div id="qualityT"></div></section></main><script>
const K="agri_v1";let db=JSON.parse(localStorage.getItem(K)||"null")||{farms:[],fields:[],seasons:[],operations:[],irrigation:[],fertilization:[],protection:[],labor:[],inputs:[],inputTxns:[],expenses:[],harvest:[],closure:[]};const views=[["dashboard","لوحة التحكم"],["farms","المزارع والحقول"],["seasons","المواسم"],["operations","العمليات"],["irrigation","الري"],["fertilization","التسميد"],["protection","المكافحة والمتابعة"],["labor","العمالة"],["inputs","المخزون"],["expenses","المصروفات"],["harvest","الحصاد"],["closure","إغلاق الموسم"],["quality","فحص الجودة"]];nav.innerHTML=views.map(x=>'<button onclick="show(\''+x[0]+'\')">'+x[1]+'</button>').join("");function show(id){document.querySelectorAll(".view").forEach(x=>x.classList.remove("active"));document.getElementById(id).classList.add("active");render()}function save(){localStorage.setItem(K,JSON.stringify(db));render()}function gid(p,a){return p+"-"+String(a.length+1).padStart(3,"0")}function tbl(a,cols){return "<table><tr>"+cols.map(c=>"<th>"+c[0]+"</th>").join("")+"</tr>"+a.map(x=>"<tr>"+cols.map(c=>"<td>"+(x[c[1]]??"")+"</td>").join("")+"</tr>").join("")+"</table>"}function farm(id){return db.farms.some(x=>x.id===id)}function field(id){return db.fields.some(x=>x.id===id)}function season(id){return db.seasons.some(x=>x.id===id)}function pos(v){return Number(v)>0}
function addFarm(){if(!fn.value.trim())return alert("أدخل اسم المزرعة");db.farms.push({id:gid("FR",db.farms),name:fn.value.trim()});save()}function addField(){if(!farm(ff.value.trim()))return alert("كود المزرعة غير موجود");if(!fl.value.trim()||!pos(fa.value))return alert("أكمل بيانات الحقل");db.fields.push({id:gid("FD",db.fields),farmId:ff.value.trim(),name:fl.value.trim(),area:Number(fa.value)});save()}function addSeason(){if(!field(sf.value.trim()))return alert("كود الحقل غير موجود");if(!sc.value.trim()||!ss.value)return alert("أكمل بيانات الموسم");db.seasons.push({id:gid("SN",db.seasons),fieldId:sf.value.trim(),crop:sc.value.trim(),start:ss.value,status:"نشط",updated:ss.value});save()}function addOperation(){if(!season(os.value.trim()))return alert("كود الموسم غير موجود");if(!ot.value.trim()||!od.value)return alert("أكمل العملية");db.operations.push({id:gid("OP",db.operations),seasonId:os.value.trim(),text:ot.value.trim(),due:od.value,status:"مفتوحة"});save()}function addIrrigation(){if(!season(is.value.trim()))return alert("كود الموسم غير موجود");if(!idate.value)return alert("أدخل التاريخ");db.irrigation.push({id:gid("IR",db.irrigation),seasonId:is.value.trim(),date:idate.value});save()}function addFertilization(){if(!season(fsn.value.trim()))return alert("كود الموسم غير موجود");if(!fm.value.trim()||!fd.value)return alert("أكمل البيانات");db.fertilization.push({id:gid("FE",db.fertilization),seasonId:fsn.value.trim(),item:fm.value.trim(),date:fd.value});save()}function addProtection(){if(!season(ps.value.trim()))return alert("كود الموسم غير موجود");if(!pn.value.trim()||!pd.value)return alert("أكمل البيانات");db.protection.push({id:gid("PR",db.protection),seasonId:ps.value.trim(),note:pn.value.trim(),date:pd.value});save()}function addLabor(){if(!season(ls.value.trim()))return alert("كود الموسم غير موجود");if(!lw.value.trim()||!pos(lc.value))return alert("أكمل البيانات");db.labor.push({id:gid("LB",db.labor),seasonId:ls.value.trim(),work:lw.value.trim(),cost:Number(lc.value)});db.expenses.push({id:gid("EX",db.expenses),seasonId:ls.value.trim(),category:"عمالة",value:Number(lc.value)});save()}function addInput(){if(!inm.value.trim()||!pos(inq.value)||Number(inmin.value)<0)return alert("أدخل بيانات صحيحة");db.inputs.push({id:gid("IN",db.inputs),name:inm.value.trim(),qty:Number(inq.value),min:Number(inmin.value)||0});save()}function addInputTxn(){let x=db.inputs.find(x=>x.id===ti.value.trim());if(!x)return alert("كود المدخل غير موجود");if(!pos(tq.value))return alert("الكمية غير صحيحة");let q=Number(tq.value);if(tt.value==="صرف"){if(!season(ts.value.trim()))return alert("كود الموسم غير موجود");if(x.qty<q)return alert("الرصيد غير كافٍ");x.qty-=q}else{x.qty+=q}db.inputTxns.push({id:gid("TX",db.inputTxns),inputId:x.id,type:tt.value,qty:q,seasonId:tt.value==="صرف"?ts.value.trim():"",date:new Date().toISOString().slice(0,10)});save()}function addExpense(){if(!season(es.value.trim()))return alert("كود الموسم غير موجود");if(!ec.value.trim()||!pos(ev.value))return alert("أدخل بيانات صحيحة");db.expenses.push({id:gid("EX",db.expenses),seasonId:es.value.trim(),category:ec.value.trim(),value:Number(ev.value)});save()}function addHarvest(){if(!season(hs.value.trim()))return alert("كود الموسم غير موجود");if(!pos(hq.value)||!hd.value)return alert("أدخل بيانات صحيحة");db.harvest.push({id:gid("HV",db.harvest),seasonId:hs.value.trim(),qty:Number(hq.value),date:hd.value});save()}
function closeSeason(){let x=db.seasons.find(x=>x.id===cs.value.trim());if(!x)return alert("كود الموسم غير موجود");if(x.status==="مغلق")return alert("الموسم مغلق بالفعل");let open=db.operations.filter(o=>o.seasonId===x.id&&o.status!=="مكتملة").length;if(open)return alert("لا يمكن الإغلاق: توجد عمليات مفتوحة");if(!db.harvest.some(h=>h.seasonId===x.id))return alert("لا يمكن الإغلاق قبل تسجيل الحصاد");if(!db.expenses.some(e=>e.seasonId===x.id))return alert("لا يمكن الإغلاق قبل مراجعة المصروفات");x.status="مغلق";x.updated=cd.value||new Date().toISOString().slice(0,10);db.closure.push({seasonId:x.id,date:x.updated});save()}function render(){farmsT.innerHTML=tbl(db.farms,[["الكود","id"],["المزرعة","name"]]);fieldsT.innerHTML=tbl(db.fields,[["الكود","id"],["المزرعة","farmId"],["الحقل","name"],["المساحة","area"]]);seasonsT.innerHTML=tbl(db.seasons,[["الكود","id"],["الحقل","fieldId"],["المحصول","crop"],["البداية","start"],["الحالة","status"]]);operationsT.innerHTML=tbl(db.operations,[["الكود","id"],["الموسم","seasonId"],["العملية","text"],["الموعد","due"],["الحالة","status"]]);irrigationT.innerHTML=tbl(db.irrigation,[["الكود","id"],["الموسم","seasonId"],["التاريخ","date"]]);fertilizationT.innerHTML=tbl(db.fertilization,[["الكود","id"],["الموسم","seasonId"],["البيان","item"],["التاريخ","date"]]);protectionT.innerHTML=tbl(db.protection,[["الكود","id"],["الموسم","seasonId"],["الملاحظة","note"],["التاريخ","date"]]);laborT.innerHTML=tbl(db.labor,[["الكود","id"],["الموسم","seasonId"],["العمل","work"],["التكلفة","cost"]]);inputsT.innerHTML=tbl(db.inputs,[["الكود","id"],["المدخل","name"],["الكمية","qty"],["حد التنبيه","min"]]);inputTxnsT.innerHTML=tbl(db.inputTxns,[["الكود","id"],["المدخل","inputId"],["الحركة","type"],["الكمية","qty"],["الموسم","seasonId"]]);expensesT.innerHTML=tbl(db.expenses,[["الكود","id"],["الموسم","seasonId"],["التصنيف","category"],["القيمة","value"]]);harvestT.innerHTML=tbl(db.harvest,[["الكود","id"],["الموسم","seasonId"],["الكمية","qty"],["التاريخ","date"]]);closureT.innerHTML=tbl(db.closure,[["الموسم","seasonId"],["تاريخ الإغلاق","date"]]);let active=db.seasons.filter(x=>x.status==="نشط").length,area=db.fields.reduce((a,x)=>a+x.area,0),exp=db.expenses.reduce((a,x)=>a+x.value,0),hv=db.harvest.reduce((a,x)=>a+x.qty,0),low=db.inputs.filter(x=>x.qty<=x.min),over=db.operations.filter(x=>x.status!=="مكتملة"&&x.due<new Date().toISOString().slice(0,10));cards.innerHTML=[["المواسم النشطة",active],["المساحة",area],["المصروفات",exp],["الحصاد",hv],["مخزون منخفض",low.length],["عمليات متأخرة",over.length]].map(x=>'<div class="card"><b>'+x[0]+'</b><h3>'+x[1]+'</h3></div>').join("");alerts.innerHTML="<h3>التنبيهات</h3>"+low.map(x=>'<p class="warn">مخزون منخفض: '+x.name+'</p>').concat(over.map(x=>'<p class="warn">عملية متأخرة: '+x.text+'</p>')).join("");qualityT.innerHTML="<p>مواسم بلا عمليات: "+db.seasons.filter(s=>!db.operations.some(o=>o.seasonId===s.id)).length+"</p><p>مواسم بلا مصروفات: "+db.seasons.filter(s=>!db.expenses.some(e=>e.seasonId===s.id)).length+"</p><p>مواسم بلا حصاد: "+db.seasons.filter(s=>!db.harvest.some(h=>h.seasonId===s.id)).length+"</p>"}render();</script></body></html>
