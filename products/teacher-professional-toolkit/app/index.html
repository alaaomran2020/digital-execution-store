<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>باكدج المدرس الاحترافي</title><style>body{font-family:Arial;background:#0a1020;color:#eef2ff;margin:0}header,nav,main{max-width:1200px;margin:auto;padding:16px}nav,.bar{display:flex;gap:8px;flex-wrap:wrap}button,input,select{padding:10px;border:1px solid #33446b;border-radius:9px;background:#111b34;color:#fff}button{cursor:pointer}.view{display:none}.active{display:block}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.card,section{background:#111b34;border:1px solid #27375c;border-radius:14px;padding:14px;margin:10px 0}.scroll{overflow:auto}table{width:100%;border-collapse:collapse}th,td{padding:8px;border-bottom:1px solid #27375c;text-align:right}.warn{color:#ffd38a}</style></head><body><header><h1>باكدج المدرس الاحترافي</h1><p>إدارة الطلاب والمجموعات والحصص والحضور والتقييم والتحصيل في نظام محلي واحد.</p><div class="bar"><button onclick="backup()">نسخة احتياطية</button><input id="restore" type="file" accept="application/json"><button onclick="restoreData()">استعادة</button></div></header><nav id="nav"></nav><main>
<section id="dashboard" class="view active"><h2>لوحة التحكم</h2><div id="cards" class="cards"></div><div id="alerts"></div></section>
<section id="students" class="view"><h2>الطلاب</h2><div class="bar"><input id="sn" placeholder="اسم الطالب"><input id="sp" placeholder="الهاتف"><button onclick="addStudent()">إضافة</button></div><div id="studentsT"></div></section>
<section id="groups" class="view"><h2>المجموعات والتسجيل</h2><div class="bar"><input id="gn" placeholder="اسم المجموعة"><input id="gsub" placeholder="المادة"><button onclick="addGroup()">إضافة مجموعة</button><input id="es" placeholder="كود الطالب"><input id="eg" placeholder="كود المجموعة"><button onclick="enroll()">تسجيل طالب</button></div><div id="groupsT"></div><div id="enrollT"></div></section>
<section id="sessions" class="view"><h2>الحصص</h2><div class="bar"><input id="sg" placeholder="كود المجموعة"><input id="sd" type="date"><input id="st" type="time"><button onclick="addSession()">إضافة حصة</button></div><div id="sessionsT"></div></section>
<section id="attendance" class="view"><h2>الحضور</h2><div class="bar"><input id="as" placeholder="كود الحصة"><input id="ast" placeholder="كود الطالب"><select id="av"><option>حاضر</option><option>غائب</option></select><button onclick="addAttendance()">تسجيل</button></div><div id="attendanceT"></div></section>
<section id="assignments" class="view"><h2>الواجبات</h2><div class="bar"><input id="ag" placeholder="كود المجموعة"><input id="at" placeholder="الواجب"><input id="ad" type="date"><button onclick="addAssignment()">إضافة</button></div><div id="assignmentsT"></div></section>
<section id="submissions" class="view"><h2>تسليم الواجبات</h2><div class="bar"><input id="shw" placeholder="كود الواجب"><input id="shst" placeholder="كود الطالب"><select id="shv"><option>تم</option><option>لم يتم</option></select><button onclick="addSubmission()">تسجيل</button></div><div id="submissionsT"></div></section><section id="assessments" class="view"><h2>التقييمات</h2><div class="bar"><input id="astd" placeholder="كود الطالب"><input id="agr" placeholder="كود المجموعة"><input id="score" type="number" placeholder="الدرجة"><input id="max" type="number" placeholder="من"><button onclick="addAssessment()">تسجيل</button></div><div id="assessmentsT"></div></section>
<section id="fees" class="view"><h2>الرسوم المستحقة</h2><div class="bar"><input id="fg" placeholder="كود المجموعة"><input id="fv" type="number" placeholder="رسوم الطالب"><button onclick="setFee()">تحديد الرسوم</button></div><div id="feesT"></div></section><section id="payments" class="view"><h2>المدفوعات</h2><div class="bar"><input id="pst" placeholder="كود الطالب"><input id="pg" placeholder="كود المجموعة"><input id="pv" type="number" placeholder="القيمة"><button onclick="addPayment()">تسجيل</button></div><div id="paymentsT"></div></section>
<section id="followup" class="view"><h2>المتابعة</h2><div class="bar"><input id="fst" placeholder="كود الطالب"><input id="fnote" placeholder="ملاحظة المتابعة"><button onclick="addFollowup()">إضافة</button></div><div id="followupT"></div></section>
<section id="reports" class="view"><h2>التقارير</h2><div id="reportsT"></div></section>
<section id="quality" class="view"><h2>فحص الجودة</h2><div id="qualityT"></div></section>
<section id="archive" class="view"><h2>الأرشفة</h2><div class="bar"><input id="arcg" placeholder="كود المجموعة"><button onclick="archiveGroup()">أرشفة المجموعة</button></div><div id="archiveT"></div></section></main><script>
const K="teacher_v1";let db=JSON.parse(localStorage.getItem(K)||"null")||{students:[],groups:[],enrollments:[],sessions:[],attendance:[],assignments:[],submissions:[],assessments:[],fees:[],payments:[],followups:[]};const V=[["dashboard","لوحة التحكم"],["students","الطلاب"],["groups","المجموعات"],["sessions","الحصص"],["attendance","الحضور"],["assignments","الواجبات"],["submissions","تسليم الواجب"],["assessments","التقييمات"],["fees","الرسوم"],["payments","المدفوعات"],["followup","المتابعة"],["reports","التقارير"],["quality","الجودة"],["archive","الأرشيف"]];nav.innerHTML=V.map(x=>'<button onclick="show(\''+x[0]+'\')">'+x[1]+'</button>').join("");function show(x){document.querySelectorAll(".view").forEach(e=>e.classList.remove("active"));document.getElementById(x).classList.add("active");render()}function save(){localStorage.setItem(K,JSON.stringify(db));render()}function id(p,a){return p+"-"+String(a.length+1).padStart(3,"0")}function pos(x){return Number(x)>0}function student(x){return db.students.some(y=>y.id===x)}function group(x){return db.groups.some(y=>y.id===x&&y.status!=="مؤرشفة")}function session(x){return db.sessions.find(y=>y.id===x)}function enrolled(st,g){return db.enrollments.some(x=>x.studentId===st&&x.groupId===g&&x.status==="نشط")}function table(a,c){return "<div class=scroll><table><tr>"+c.map(x=>"<th>"+x[0]+"</th>").join("")+"</tr>"+a.map(r=>"<tr>"+c.map(x=>"<td>"+(r[x[1]]??"")+"</td>").join("")+"</tr>").join("")+"</table></div>"}
function addStudent(){if(!sn.value.trim())return alert("أدخل اسم الطالب");if(sp.value.trim()&&db.students.some(x=>x.phone===sp.value.trim()))return alert("الهاتف مسجل لطالب آخر");db.students.push({id:id("ST",db.students),name:sn.value.trim(),phone:sp.value.trim(),status:"نشط"});save()}function addGroup(){if(!gn.value.trim()||!gsub.value.trim())return alert("أكمل البيانات");db.groups.push({id:id("GR",db.groups),name:gn.value.trim(),subject:gsub.value.trim(),status:"نشطة"});save()}function enroll(){let s=es.value.trim(),g=eg.value.trim();if(!student(s)||!group(g))return alert("الطالب أو المجموعة غير موجود");if(enrolled(s,g))return alert("الطالب مسجل بالفعل");db.enrollments.push({id:id("EN",db.enrollments),studentId:s,groupId:g,status:"نشط"});save()}function completeSession(id){let x=db.sessions.find(s=>s.id===id);if(x){x.status="مكتملة";save()}}function addSession(){if(!group(sg.value.trim())||!sd.value||!st.value)return alert("أكمل بيانات صحيحة");db.sessions.push({id:id("SE",db.sessions),groupId:sg.value.trim(),date:sd.value,time:st.value,status:"مجدولة"});save()}function addAttendance(){let se=session(as.value.trim()),st=ast.value.trim();if(!se||!student(st)||!enrolled(st,se.groupId))return alert("الطالب غير مسجل في مجموعة الحصة");if(db.attendance.some(x=>x.sessionId===se.id&&x.studentId===st))return alert("الحضور مسجل بالفعل");db.attendance.push({id:id("AT",db.attendance),sessionId:se.id,studentId:st,status:av.value});save()}function addAssignment(){if(!group(ag.value.trim())||!at.value.trim()||!ad.value)return alert("أكمل البيانات");db.assignments.push({id:id("HW",db.assignments),groupId:ag.value.trim(),title:at.value.trim(),due:ad.value});save()}function addSubmission(){let hw=db.assignments.find(x=>x.id===shw.value.trim()),st=shst.value.trim();if(!hw||!student(st)||!enrolled(st,hw.groupId))return alert("بيانات التسليم غير صحيحة");let old=db.submissions.find(x=>x.assignmentId===hw.id&&x.studentId===st);if(old)old.status=shv.value;else db.submissions.push({id:id("SB",db.submissions),assignmentId:hw.id,studentId:st,status:shv.value});save()}function addAssessment(){let st=astd.value.trim(),g=agr.value.trim(),a=Number(score.value),m=Number(max.value);if(!student(st)||!group(g)||!enrolled(st,g)||!pos(m)||a<0||a>m)return alert("بيانات التقييم غير صحيحة");if(db.assessments.some(x=>x.studentId===st&&x.groupId===g))return alert("التقييم مسجل؛ استخدم دورة تقييم جديدة لاحقًا");db.assessments.push({id:id("AS",db.assessments),studentId:st,groupId:g,score:a,max:m});save()}function setFee(){let g=fg.value.trim();if(!group(g)||!pos(fv.value))return alert("بيانات الرسوم غير صحيحة");let old=db.fees.find(x=>x.groupId===g);if(old)old.value=Number(fv.value);else db.fees.push({id:id("FE",db.fees),groupId:g,value:Number(fv.value)});save()}function addPayment(){let st=pst.value.trim(),g=pg.value.trim();if(!student(st)||!group(g)||!enrolled(st,g)||!pos(pv.value))return alert("بيانات الدفع غير صحيحة");db.payments.push({id:id("PY",db.payments),studentId:st,groupId:g,value:Number(pv.value),date:new Date().toISOString().slice(0,10)});save()}function addFollowup(){if(!student(fst.value.trim())||!fnote.value.trim())return alert("أكمل البيانات");db.followups.push({id:id("FU",db.followups),studentId:fst.value.trim(),note:fnote.value.trim(),date:new Date().toISOString().slice(0,10)});save()}function archiveGroup(){let g=db.groups.find(x=>x.id===arcg.value.trim());if(!g)return alert("المجموعة غير موجودة");let future=db.sessions.some(x=>x.groupId===g.id&&x.date>=new Date().toISOString().slice(0,10));if(future)return alert("لا يمكن الأرشفة مع وجود حصص حالية أو قادمة");let members=db.enrollments.filter(x=>x.groupId===g.id&&x.status==="نشط");let fee=db.fees.find(x=>x.groupId===g.id)?.value||0;let outstanding=members.reduce((a,e)=>a+Math.max(0,fee-db.payments.filter(p=>p.groupId===g.id&&p.studentId===e.studentId).reduce((z,p)=>z+p.value,0)),0);if(outstanding>0)return alert("لا يمكن الأرشفة مع وجود مستحقات مالية: "+outstanding);g.status="مؤرشفة";db.enrollments.filter(x=>x.groupId===g.id).forEach(x=>x.status="مؤرشف");save()}function backup(){let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:"application/json"}));a.download="teacher-backup-v1.0.0.json";a.click()}function restoreData(){let f=restore.files[0];if(!f)return alert("اختر ملفًا");let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.students||!x.groups||!x.enrollments)return alert("ملف غير صالح");db=x;save()}catch(e){alert("ملف غير صالح")}};r.readAsText(f)}
function render(){studentsT.innerHTML=table(db.students,[["الكود","id"],["الاسم","name"],["الهاتف","phone"]]);groupsT.innerHTML=table(db.groups,[["الكود","id"],["المجموعة","name"],["المادة","subject"],["الحالة","status"]]);enrollT.innerHTML=table(db.enrollments,[["الكود","id"],["الطالب","studentId"],["المجموعة","groupId"],["الحالة","status"]]);sessionsT.innerHTML=table(db.sessions,[["الكود","id"],["المجموعة","groupId"],["التاريخ","date"],["الوقت","time"]]);attendanceT.innerHTML=table(db.attendance,[["الحصة","sessionId"],["الطالب","studentId"],["الحالة","status"]]);assignmentsT.innerHTML=table(db.assignments,[["المجموعة","groupId"],["الواجب","title"],["التسليم","due"]]);submissionsT.innerHTML=table(db.submissions,[["الواجب","assignmentId"],["الطالب","studentId"],["الحالة","status"]]);assessmentsT.innerHTML=table(db.assessments,[["الطالب","studentId"],["المجموعة","groupId"],["الدرجة","score"],["من","max"]]);feesT.innerHTML=table(db.fees,[["المجموعة","groupId"],["رسوم الطالب","value"]]);paymentsT.innerHTML=table(db.payments,[["الطالب","studentId"],["المجموعة","groupId"],["القيمة","value"],["التاريخ","date"]]);followupT.innerHTML=table(db.followups,[["الطالب","studentId"],["الملاحظة","note"],["التاريخ","date"]]);let today=new Date().toISOString().slice(0,10),active=db.groups.filter(x=>x.status==="نشطة").length,up=db.sessions.filter(x=>x.date>=today).length,abs=db.attendance.filter(x=>x.status==="غائب").length,pay=db.payments.reduce((a,x)=>a+x.value,0),without=db.students.filter(s=>!db.followups.some(f=>f.studentId===s.id)).length;cards.innerHTML=[["الطلاب",db.students.length],["المجموعات النشطة",active],["الحصص القادمة",up],["الغياب",abs],["التحصيل",pay],["بدون متابعة",without]].map(x=>'<div class=card><b>'+x[0]+'</b><h3>'+x[1]+'</h3></div>').join("");alerts.innerHTML="<h3>التنبيهات</h3>"+(without?'<p class=warn>طلاب بدون متابعة: '+without+'</p>':"")+(abs?'<p class=warn>سجلات غياب تحتاج متابعة: '+abs+'</p>':"");let due=db.enrollments.filter(e=>e.status==="نشط").reduce((a,e)=>{let fee=db.fees.find(f=>f.groupId===e.groupId)?.value||0,paid=db.payments.filter(p=>p.groupId===e.groupId&&p.studentId===e.studentId).reduce((z,p)=>z+p.value,0);return a+Math.max(0,fee-paid)},0);let attendanceRate=db.attendance.length?Math.round(db.attendance.filter(x=>x.status==="حاضر").length/db.attendance.length*100):0;let avg=db.assessments.length?Math.round(db.assessments.reduce((a,x)=>a+(x.score/x.max*100),0)/db.assessments.length):0;reportsT.innerHTML="<p>متوسط التقييمات: "+avg+"%</p><p>نسبة الحضور: "+attendanceRate+"%</p><p>إجمالي التحصيل: "+pay+"</p><p>إجمالي المستحقات المتبقية: "+due+"</p><p>إجمالي الحضور المسجل: "+db.attendance.length+"</p>";qualityT.innerHTML="<p>غياب يحتاج متابعة: "+db.attendance.filter(a=>a.status===\"غائب\"&&!db.followups.some(f=>f.studentId===a.studentId&&f.date>=db.sessions.find(s=>s.id===a.sessionId)?.date)).length+"</p><p>واجبات بلا تسليمات: "+db.assignments.filter(h=>!db.submissions.some(x=>x.assignmentId===h.id)).length+"</p><p>طلاب بلا مجموعة: "+db.students.filter(s=>!db.enrollments.some(e=>e.studentId===s.id&&e.status==="نشط")).length+"</p><p>مجموعات بلا حصص: "+db.groups.filter(g=>g.status==="نشطة"&&!db.sessions.some(s=>s.groupId===g.id)).length+"</p><p>طلاب بلا تقييم: "+db.students.filter(s=>!db.assessments.some(a=>a.studentId===s.id)).length+"</p>";archiveT.innerHTML=table(db.groups.filter(x=>x.status==="مؤرشفة"),[["الكود","id"],["المجموعة","name"],["المادة","subject"]])}render();</script></body></html>
