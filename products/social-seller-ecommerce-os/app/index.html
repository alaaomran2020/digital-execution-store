<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Social Seller / E-commerce Operations OS</title><style>*{box-sizing:border-box}body{font-family:Arial;background:#09101f;color:#eef2ff;margin:0}header,nav,main{max-width:1280px;margin:auto;padding:16px}nav,.bar{display:flex;gap:8px;flex-wrap:wrap}button,input,select{padding:10px;border:1px solid #33446b;border-radius:9px;background:#111b34;color:#fff}button{cursor:pointer}.view{display:none}.active{display:block}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:10px}.card,section{background:#111b34;border:1px solid #27375c;border-radius:14px;padding:14px;margin:10px 0}.scroll{overflow:auto}table{width:100%;border-collapse:collapse}th,td{padding:8px;border-bottom:1px solid #27375c;text-align:right;white-space:nowrap}.warn{color:#ffd38a}.ok{color:#8df0b3}</style></head><body>
<header><h1>Social Seller / E-commerce Operations OS</h1><p>Lead → Customer → Product → Order → Fulfillment → Shipping → Collection → Return → Expenses → Profitability → Archive</p><div class="bar"><button onclick="backup()">نسخة احتياطية</button><input id="restore" type="file" accept="application/json"><button onclick="restoreData()">استعادة النسخة</button></div></header><nav id="nav"></nav><main>
<section id="dashboard" class="view active"><h2>لوحة التحكم</h2><div id="cards" class="cards"></div><div id="alerts"></div></section>
<section id="leads" class="view"><h2>الاستفسارات</h2><div class="bar"><input id="ln" placeholder="اسم العميل"><input id="lc" placeholder="رقم الهاتف أو وسيلة التواصل"><input id="ls" placeholder="مصدر الاستفسار"><input id="lf" type="date"><button onclick="addLead()">إضافة</button><input id="convertLeadId" placeholder="كود الاستفسار"><button onclick="convertLead()">إنشاء طلب</button></div><div id="leadsT"></div></section>
<section id="clients" class="view"><h2>العملاء</h2><div class="bar"><input id="cn" placeholder="اسم العميل"><input id="cc" placeholder="وسيلة التواصل"><input id="ca" placeholder="العنوان"><button onclick="addClient()">إضافة</button></div><div id="clientsT"></div></section>
<section id="products" class="view"><h2>المنتجات والمخزون</h2><div class="bar"><input id="sku" placeholder="SKU"><input id="prodName" placeholder="اسم المنتج"><input id="prodCost" type="number" min="0" placeholder="تكلفة الوحدة"><input id="prodPrice" type="number" min="0" placeholder="سعر البيع"><input id="prodStock" type="number" min="0" placeholder="الرصيد الحالي"><input id="reorder" type="number" min="0" placeholder="حد إعادة الطلب"><button onclick="addProduct()">إضافة</button></div><div id="productsT"></div></section>
<section id="orders" class="view"><h2>الطلبات</h2><div class="bar"><input id="orderClient" placeholder="كود العميل"><input id="orderSku" placeholder="SKU"><input id="orderQty" type="number" min="1" placeholder="الكمية"><input id="orderShipping" type="number" min="0" placeholder="شحن محصل من العميل"><input id="orderDiscount" type="number" min="0" placeholder="الخصم"><button onclick="addOrder()">إنشاء طلب</button></div><div id="ordersT"></div></section>
<section id="fulfillment" class="view"><h2>التجهيز والشحن والتحصيل</h2><div class="bar"><input id="flowOrder" placeholder="كود الطلب"><select id="flowStatus"><option value="new">جديد</option><option value="preparing">قيد التجهيز</option><option value="ready">جاهز للشحن</option><option value="shipped">تم الشحن</option><option value="delivered">تم التسليم</option><option value="cancelled">ملغي</option></select><input id="shipCompany" placeholder="شركة الشحن"><input id="tracking" placeholder="رقم التتبع"><input id="shipCost" type="number" min="0" placeholder="تكلفة الشحن الفعلية"><input id="collected" type="number" min="0" placeholder="إجمالي المحصل"><button onclick="updateFlow()">إضافة</button></div><div id="flowT"></div></section>
<section id="returns" class="view"><h2>المرتجعات</h2><div class="bar"><input id="returnOrder" placeholder="كود الطلب"><input id="returnQty" type="number" min="1" placeholder="الكمية المرتجعة"><select id="restock"><option value="yes">صالح ويعود للمخزون</option><option value="no">تالف / لا يعود للمخزون</option></select><input id="returnRefund" type="number" min="0" placeholder="المبلغ المردود للعميل"><input id="returnReason" placeholder="سبب المرتجع"><button onclick="addReturn()">إضافة</button></div><div id="returnsT"></div></section>
<section id="expenses" class="view"><h2>المصروفات</h2><div class="bar"><input id="expOrder" placeholder="كود الطلب - اختياري"><input id="expCat" placeholder="بند المصروف"><input id="expAmount" type="number" min="0" placeholder="قيمة المصروف"><button onclick="addExpense()">إضافة</button></div><div id="expensesT"></div></section>
<section id="reports" class="view"><h2>الربحية</h2><div id="reportsT"></div></section><section id="quality" class="view"><h2>فحص الجودة</h2><div id="qualityT"></div></section><section id="archive" class="view"><h2>الأرشيف</h2><div id="archiveT"></div></section></main>
<script>
const K='de_social_seller_ecommerce_os_v1',blank=()=>({leads:[],clients:[],products:[],orders:[],returns:[],expenses:[]});let db;try{db=JSON.parse(localStorage.getItem(K)||'null')||blank()}catch(e){db=blank()}for(const k of Object.keys(blank()))if(!Array.isArray(db[k]))db[k]=[];
const V=[['dashboard','لوحة التحكم'],['leads','الاستفسارات'],['clients','العملاء'],['products','المنتجات والمخزون'],['orders','الطلبات'],['fulfillment','التجهيز والشحن'],['returns','المرتجعات'],['expenses','المصروفات'],['reports','الربحية'],['quality','الجودة'],['archive','الأرشيف']];nav.innerHTML=V.map(x=>`<button onclick="show('${x[0]}')">${x[1]}</button>`).join('');
const n=x=>Number(x)||0,today=()=>new Date().toISOString().slice(0,10),money=x=>n(x).toLocaleString('ar-EG')+' ج.م';function id(p,a){return p+'-'+String(a.reduce((m,x)=>Math.max(m,n(String(x.id||'').split('-').pop())),0)+1).padStart(4,'0')}function save(){localStorage.setItem(K,JSON.stringify(db));render()}function show(x){document.querySelectorAll('.view').forEach(e=>e.classList.remove('active'));document.getElementById(x).classList.add('active');render()}function client(x){return db.clients.find(y=>y.id===x)}function product(x){return db.products.find(y=>y.sku===x)}function order(x){return db.orders.find(y=>y.id===x)}function table(a,c){return '<div class=scroll><table><tr>'+c.map(x=>'<th>'+x[0]+'</th>').join('')+'</tr>'+a.map(r=>'<tr>'+c.map(x=>'<td>'+(r[x[1]] ?? '')+'</td>').join('')+'</tr>').join('')+'</table></div>'}
function addLead(){if(!ln.value.trim())return alert('أدخل البيانات المطلوبة');db.leads.push({id:id('LD',db.leads),name:ln.value.trim(),contact:lc.value.trim(),source:ls.value.trim(),followup:lf.value,status:'new'});save()}function addClient(){if(!cn.value.trim())return alert('أدخل البيانات المطلوبة');db.clients.push({id:id('CL',db.clients),name:cn.value.trim(),contact:cc.value.trim(),address:ca.value.trim(),status:'new'});save()}function convertLead(){let l=db.leads.find(x=>x.id===convertLeadId.value.trim());if(!l)return alert('البيانات المطلوبة غير موجودة أو غير صحيحة');if(l.status==='converted')return alert('البيانات المطلوبة غير موجودة أو غير صحيحة');db.clients.push({id:id('CL',db.clients),name:l.name,contact:l.contact,address:'',status:'new'});l.status='converted';save()}
function addProduct(){let s=sku.value.trim();if(!s||!prodName.value.trim()||n(prodCost.value)<0||n(prodPrice.value)<=0||n(prodStock.value)<0)return alert('بيانات العملية غير صحيحة');if(product(s))return alert('كود SKU مسجل بالفعل');db.products.push({sku:s,name:prodName.value.trim(),cost:n(prodCost.value),price:n(prodPrice.value),stock:n(prodStock.value),reorder:n(reorder.value)});save()}
function addOrder(){let c=client(orderClient.value.trim()),p=product(orderSku.value.trim()),q=n(orderQty.value),discount=n(orderDiscount.value),shipping=n(orderShipping.value);if(!c||!p||q<=0)return alert('تحقق من العميل والمنتج والكمية');if(p.stock<q)return alert('البيانات المطلوبة غير موجودة أو غير صحيحة');let goods=p.price*q;if(discount>goods)return alert('بيانات العملية غير صحيحة');p.stock-=q;db.orders.push({id:id('OR',db.orders),clientId:c.id,sku:p.sku,qty:q,unitPrice:p.price,unitCost:p.cost,discount,shippingCharge:shipping,total:goods-discount+shipping,status:'new',shippingCompany:'',tracking:'',shippingCost:0,collected:0,date:today()});save()}
function updateFlow(){let o=order(flowOrder.value.trim());if(!o)return alert('البيانات المطلوبة غير موجودة أو غير صحيحة');let amount=n(collected.value);if(amount<0||amount>Math.max(0,o.total-refundTotal(o)))return alert('القيمة تتجاوز الحد المسموح للعملية');if(o.status==='cancelled'&&flowStatus.value!=='cancelled')return alert('لا يمكن إعادة فتح طلب ملغي بعد إعادة المخزون');if(flowStatus.value==='cancelled'&&o.status!=='cancelled'){let p=product(o.sku),rq=returnQty(o);if(p)p.stock+=Math.max(0,o.qty-rq)}o.status=flowStatus.value;o.shippingCompany=shipCompany.value.trim();o.tracking=tracking.value.trim();o.shippingCost=n(shipCost.value);o.collected=amount;save()}
function returnQty(o){return db.returns.filter(r=>r.orderId===o.id).reduce((a,r)=>a+r.qty,0)}function refundTotal(o){return db.returns.filter(r=>r.orderId===o.id).reduce((a,r)=>a+r.refund,0)}function addReturn(){let o=order(returnOrder.value.trim()),q=n(returnQty.value),refund=n(returnRefund.value);if(!o||q<=0||refund<0)return alert('بيانات المرتجع غير صحيحة');if(o.status==='cancelled')return alert('لا يمكن تسجيل مرتجع على طلب ملغي');if(returnQty(o)+q>o.qty)return alert('القيمة تتجاوز الحد المسموح للعملية');let isRestock=restock.value==='yes';db.returns.push({id:id('RT',db.returns),orderId:o.id,sku:o.sku,qty:q,restock:isRestock,refund,reason:returnReason.value.trim(),date:today()});if(isRestock){let p=product(o.sku);if(p)p.stock+=q}save()}
function addExpense(){let oid=expOrder.value.trim();if(oid&&!order(oid))return alert('بيانات العملية غير صحيحة');if(!expCat.value.trim()||n(expAmount.value)<=0)return alert('بيانات العملية غير صحيحة');db.expenses.push({id:id('EX',db.expenses),orderId:oid,category:expCat.value.trim(),amount:n(expAmount.value),date:today()});save()}
function metrics(o){let rr=db.returns.filter(r=>r.orderId===o.id),rq=rr.reduce((a,r)=>a+r.qty,0),restocked=rr.filter(r=>r.restock).reduce((a,r)=>a+r.qty,0),refund=rr.reduce((a,r)=>a+r.refund,0),net=Math.max(0,o.unitPrice*o.qty-o.discount-refund),cogs=Math.max(0,(o.qty-restocked)*o.unitCost),exp=db.expenses.filter(e=>e.orderId===o.id).reduce((a,e)=>a+e.amount,0),profit=net+o.shippingCharge-cogs-o.shippingCost-exp;return{net,cogs,exp,profit,refund}}
function backup(){let a=document.createElement('a'),u=URL.createObjectURL(new Blob([JSON.stringify({schema:1,product:'social-seller-ecommerce-os',version:'1.0.0',exportedAt:new Date().toISOString(),data:db},null,2)],{type:'application/json'}));a.href=u;a.download='social-seller-ecommerce-os-v1.0.0-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}function restoreData(){let f=restore.files[0];if(!f)return alert('أدخل البيانات المطلوبة');let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result),d=x&&x.data?x.data:x;if(!d||!['leads','clients','products','orders','returns','expenses'].every(k=>Array.isArray(d[k])))return alert('ملف النسخة الاحتياطية غير متوافق');db=d;save();alert('تمت استعادة النسخة الاحتياطية بنجاح')}catch(e){alert('البيانات المطلوبة غير موجودة أو غير صحيحة')}};r.readAsText(f)}
function render(){leadsT.innerHTML=table(db.leads,[['الكود','id'],['الاسم','name'],['التواصل','contact'],['المصدر','source'],['المتابعة','followup'],['الحالة','status']]);clientsT.innerHTML=table(db.clients,[['الكود','id'],['الاسم','name'],['التواصل','contact'],['العنوان','address']]);productsT.innerHTML=table(db.products.map(x=>({...x,cost:money(x.cost),price:money(x.price)})),[['SKU','sku'],['الاسم','name'],['التكلفة','cost'],['السعر','price'],['الرصيد','stock'],['حد إعادة الطلب','reorder']]);ordersT.innerHTML=table(db.orders.map(x=>({...x,total:money(x.total)})),[['الكود','id'],['العميل','clientId'],['SKU','sku'],['الكمية','qty'],['الإجمالي','total'],['الحالة','status']]);flowT.innerHTML=table(db.orders.map(x=>({...x,shippingCost:money(x.shippingCost),collected:money(x.collected)})),[['الكود','id'],['الحالة','status'],['شركة الشحن','shippingCompany'],['التتبع','tracking'],['تكلفة الشحن','shippingCost'],['المحصل','collected']]);returnsT.innerHTML=table(db.returns.map(x=>({...x,restock:x.restock?'نعم':'لا',refund:money(x.refund)})),[['الكود','id'],['الطلب','orderId'],['الكمية','qty'],['إعادة للمخزون','restock'],['المسترد','refund'],['السبب','reason']]);expensesT.innerHTML=table(db.expenses.map(x=>({...x,amount:money(x.amount)})),[['الكود','id'],['الطلب','orderId'],['البند','category'],['القيمة','amount']]);
let live=db.orders.filter(o=>!['delivered','cancelled'].includes(o.status)).length,stock=db.products.reduce((a,p)=>a+p.stock*p.cost,0),sales=db.orders.filter(o=>o.status!=='cancelled').reduce((a,o)=>a+metrics(o).net,0),col=db.orders.reduce((a,o)=>a+o.collected,0),profit=db.orders.filter(o=>o.status!=='cancelled').reduce((a,o)=>a+metrics(o).profit,0),low=db.products.filter(p=>p.stock<=p.reorder).length,due=db.orders.filter(o=>o.status!=='cancelled'&&o.collected<Math.max(0,o.total-refundTotal(o))).length;cards.innerHTML=[['طلبات مفتوحة',live],['قيمة المخزون',money(stock)],['صافي المبيعات',money(sales)],['التحصيل',money(col)],['الربح التشغيلي',money(profit)],['مخزون منخفض',low]].map(x=>`<div class=card><b>${x[0]}</b><h3>${x[1]}</h3></div>`).join('');alerts.innerHTML=`<h3>التنبيهات</h3><p class="${low?'warn':'ok'}">مخزون منخفض: ${low}</p><p class="${due?'warn':'ok'}">طلبات غير مكتملة التحصيل: ${due}</p>`;
let rows=db.orders.filter(o=>o.status!=='cancelled').map(o=>{let m=metrics(o);return{id:o.id,sku:o.sku,sales:money(m.net),cogs:money(m.cogs),shipping:money(o.shippingCost),expenses:money(m.exp),profit:money(m.profit)}});reportsT.innerHTML=table(rows,[['الطلب','id'],['SKU','sku'],['صافي المبيعات','sales'],['تكلفة البضاعة','cogs'],['الشحن','shipping'],['المصروفات','expenses'],['الربح','profit']]);let orphan=db.orders.filter(o=>!client(o.clientId)||!product(o.sku)).length,negative=db.products.filter(p=>p.stock<0).length,duplicate=new Set(db.products.map(p=>p.sku)).size!==db.products.length;qualityT.innerHTML=`<p>طلبات يتيمة: ${orphan}</p><p>مخزون سالب: ${negative}</p><p>SKU مكرر: ${duplicate?'نعم':'0'}</p><p>طلبات غير مكتملة التحصيل: ${due}</p>`;archiveT.innerHTML=table(db.orders.filter(o=>['delivered','cancelled'].includes(o.status)),[['الكود','id'],['العميل','clientId'],['SKU','sku'],['الكمية','qty'],['الحالة','status']])}render();
</script></body></html>
