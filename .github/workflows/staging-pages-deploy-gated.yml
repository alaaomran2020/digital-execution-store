name: Staging Pages Deployment (approval gated)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: isolated-staging-pages-deployment
  cancel-in-progress: false

jobs:
  validate:
    name: Validate staging build without deployment
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate staging content and build
        env:
          CF_PAGES_BRANCH: staging
          CF_PAGES_COMMIT_SHA: ${{ github.sha }}
        run: |
          node qa/storefront-paused-qa.mjs
          node qa/site-sections-qa.mjs
          node qa/build-staging.mjs
          test -f dist-staging/_headers
          test ! -e dist-staging/CNAME
          test -f dist-staging/services/graphic-design/gallery.js
      - uses: actions/upload-artifact@v4
        with:
          name: staging-build-review
          path: dist-staging/
          retention-days: 7

  deploy:
    name: Deploy only after environment approval
    needs: validate
    if: ${{ github.ref == 'refs/heads/staging' && vars.ENABLE_STAGING_PAGES_DEPLOY == 'true' }}
    environment: staging-pages-deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact staging head and rebuild
        env:
          CF_PAGES_BRANCH: staging
          CF_PAGES_COMMIT_SHA: ${{ github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node qa/build-staging.mjs
      - name: Deploy to isolated Cloudflare Pages project
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_STAGING_PAGES_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_STAGING_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npx --yes wrangler@4 pages deploy dist-staging --project-name digital-execution-staging --branch staging --commit-hash "$GITHUB_SHA"
