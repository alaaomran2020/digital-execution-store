name: Generate Career Kit social preview

on:
  push:
    branches: [fix/career-kit-social-preview]
    paths:
      - "assets/career-kit/career-kit-og.svg"
      - ".github/workflows/generate-career-kit-og.yml"

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install render tools
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin webp
      - name: Render 1200x630 assets
        run: |
          rsvg-convert -w 1200 -h 630 assets/career-kit/career-kit-og.svg > assets/career-kit/career-kit-og.png
          cwebp -quiet -q 92 assets/career-kit/career-kit-og.png -o assets/career-kit/career-kit-og.webp
      - name: Commit generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/career-kit/career-kit-og.png assets/career-kit/career-kit-og.webp
          git diff --cached --quiet || git commit -m "chore: render Career Kit social preview"
          git push
