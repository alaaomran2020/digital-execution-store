name: Accountant Browser QA

on:
  pull_request:
    paths:
      - 'products/accountant-professional-toolkit/index.html'
      - 'script.js'
      - 'data/products.json'
      - 'qa/accountant-browser-qa.mjs'
      - '.github/workflows/accountant-browser-qa.yml'

permissions:
  contents: read

jobs:
  accountant-browser-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Detect temporary product pause
        id: product_visibility
        run: |
          echo "paused=$(node -p "require('./data/storefront-mode.json').productsVisible===false")" >> "$GITHUB_OUTPUT"
      - name: Verify paused product URLs
        if: steps.product_visibility.outputs.paused == 'true'
        run: node qa/storefront-paused-qa.mjs
      - name: Install browser test dependency
        if: steps.product_visibility.outputs.paused != 'true'
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Run page in Chromium
        if: steps.product_visibility.outputs.paused != 'true'
        run: node qa/accountant-browser-qa.mjs
