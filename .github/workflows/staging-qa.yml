name: Staging QA (no deployment)

on:
  push:
    branches: [staging]
  pull_request:
    branches: [staging]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  staging-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Enforce paused-products staging mode
        run: node -e "const m=require('./data/storefront-mode.json');if(m.productsVisible!==false){console.error('Staging must keep products hidden');process.exit(1)}"
      - name: Verify storefront pause
        run: node qa/storefront-paused-qa.mjs
      - name: Verify independent tool and service sections
        run: node qa/site-sections-qa.mjs
      - name: Verify and package isolated Cloudflare Pages staging build
        env:
          CF_PAGES_BRANCH: staging
        run: |
          node qa/build-staging.mjs
          test -f dist-staging/services/graphic-design/studio.css
          test -f dist-staging/services/graphic-design/gallery.js
          test -f dist-staging/services/graphic-design/brief.js
          test -f dist-staging/_headers
          test ! -e dist-staging/CNAME
          test -f dist-staging/data/products.json
          node -e "const fs=require('fs');if(fs.readFileSync('dist-staging/data/products.json','utf8')!=='[]\n')process.exit(1)"
          node qa/site-link-integrity-qa.mjs
