name: Paused Legacy Footer QA
on:
  pull_request:
    paths:
      - 'script.js'
      - 'footer.js'
      - 'qa/paused-legacy-footer-qa.mjs'
      - '.github/workflows/paused-legacy-footer-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  footer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify no legacy paid footer on public pages
        run: node qa/paused-legacy-footer-qa.mjs
      - name: Preserve paused storefront gate
        run: node qa/storefront-paused-qa.mjs
