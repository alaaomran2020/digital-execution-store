name: Design Studio Browser QA

on:
  pull_request:
    paths:
      - "services/graphic-design/**"
      - "qa/design-studio-browser-qa.mjs"
      - ".github/workflows/design-studio-browser-qa.yml"
      - "styles.css"
      - "brand.css"
      - "sections.css"
      - "header.css"
      - "header.js"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  design-studio-visual:
    name: Design Studio Mobile/Desktop Browser QA
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate isolated Cloudflare Staging build output (no deployment)
        env:
          CF_PAGES_BRANCH: staging
        run: |
          node qa/build-staging.mjs
          test -f dist-staging/staging-build.json
          test -f dist-staging/_headers
          test -f dist-staging/services/graphic-design/studio.css
          test ! -e dist-staging/CNAME
      - name: Install temporary browser test dependency
        run: |
          npm install --no-save --ignore-scripts --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Run real Chromium checks against local PR preview
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/design-studio-http.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          node qa/design-studio-browser-qa.mjs
      - name: Upload preview screenshots and machine-readable report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: design-studio-visual-qa
          path: artifacts/design-visual-qa/
          if-no-files-found: warn
          retention-days: 14
