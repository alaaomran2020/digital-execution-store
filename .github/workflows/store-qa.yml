name: Store QA

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  store-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run store architecture checks
        run: node qa/store-qa.mjs
