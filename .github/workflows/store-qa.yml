name: Store QA

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  store-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run store architecture checks
        run: node qa/store-qa.mjs
      - name: Verify curated free resources and draft visibility
        run: node qa/free-resources-qa.mjs
      - name: Verify independent tools and service sections
        run: node qa/site-sections-qa.mjs
      - name: Verify approved graphic design preview images
        run: node qa/design-studio-images-qa.mjs
      - name: Verify safe standalone Calculator Suite Free download
        run: node qa/free-release-qa.mjs
      - name: Verify M1/M2 lightweight storefront and Egyptian copy
        run: node qa/m1m2-storefront-qa.mjs
      - name: Validate Metricool loader JavaScript syntax
        run: node --check header.js && node --check metricool-tracker.js
      - name: Verify Metricool tracker privacy and performance guard
        run: node qa/metricool-tracking-qa.mjs
