name: Store QA

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  store-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run store architecture checks
        run: |
          if node -e "const cfg=require('./data/storefront-mode.json');process.exit(cfg.productsVisible===false?0:1)" 2>/dev/null; then
            node qa/storefront-paused-qa.mjs
          else
            node qa/store-qa.mjs
          fi
      - name: Verify independent tools and service sections
        run: node qa/site-sections-qa.mjs
      - name: Verify paused inventory-counting guide navigation
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const assert = require('node:assert/strict');
          const mode = JSON.parse(fs.readFileSync('data/storefront-mode.json', 'utf8'));
          if (mode.productsVisible === false) {
            const guide = fs.readFileSync('guides/inventory-counting/index.html', 'utf8');
            assert.doesNotMatch(guide, /href=["'][^"']*\/products\//, 'Paused guide must not link to hidden products');
            assert.doesNotMatch(guide, /guide_product_click|ReStock Desk/, 'Paused guide must not promote paid products');
            assert.match(guide, /href="\.\.\/\.\.\/tools\/inventory-health-check\/"/, 'Free tool link missing');
            assert.match(guide, /href="\.\.\/\.\.\/tools\/"/, 'Active tools footer link missing');
            console.log('PASS 4 paused inventory-counting guide checks');
          }
          NODE
